name: Package wrapper tests
on:
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/package-wrapper-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/package-wrapper-tests.yml'
permissions:
  contents: read
jobs:
  wrappers:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test package scripts without a device
        run: python -m unittest discover -s tools/tests -p test_package_wrappers.py -v
